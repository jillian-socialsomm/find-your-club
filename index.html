<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
  :root {
    --purple: #403393;
    --purple-soft: #7A70C0;
    --purple-line: #DFDAF2;
    --lavender: #F5F3FA;
    --white: #FFFFFF;
    --gold: #C9A24B;
    --bright: #5819E0;
    --font-display: "Georgia Pro", Georgia, serif;
    --font-body: "Figtree", -apple-system, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--lavender);
    font-family: var(--font-body);
    color: var(--purple);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .quiz { width: 100%; max-width: 480px; }
  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 2px; font-weight: 700;
    color: var(--purple-soft); text-transform: uppercase;
  }
  .step-count { font-size: 13px; color: var(--purple-soft); }
  .progress { display: flex; gap: 6px; margin-bottom: 32px; }
  .progress span {
    height: 4px; flex: 1; border-radius: 2px;
    background: var(--purple-line);
    transition: background .3s;
  }
  .progress span.done { background: var(--purple); }
  .kicker { font-size: 14px; color: var(--purple-soft); margin-bottom: 8px; }
  h1 {
    font-family: var(--font-display);
    font-size: 26px; font-weight: 600; line-height: 1.25;
    text-wrap: balance; margin-bottom: 6px;
  }
  .helper { font-size: 14px; color: var(--purple-soft); margin-bottom: 24px; }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--white);
    border: 1.5px solid var(--purple-line);
    border-radius: 14px;
    padding: 15px 18px;
    font-family: var(--font-body);
    font-size: 15px; line-height: 1.4;
    color: var(--purple);
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s, transform .1s;
  }
  .answer:hover { border-color: var(--purple-soft); }
  .answer:active { transform: scale(.985); }
  .answer:focus-visible { outline: 3px solid var(--purple-soft); outline-offset: 2px; }
  .answer.selected {
    background: var(--purple);
    border-color: var(--purple);
    color: var(--lavender);
  }
  .answer .tick { opacity: 0; font-size: 18px; flex: none; }
  .answer.selected .tick { opacity: 1; }
  .answer .price {
    flex: none; font-size: 12.5px; font-weight: 700;
    background: var(--lavender); color: var(--purple-soft);
    border-radius: 12px; padding: 3px 10px; white-space: nowrap;
  }
  .answer.selected .price { background: rgba(245,243,250,.18); color: var(--lavender); }
  .footer-row {
    margin-top: 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .pick-note { font-size: 14px; color: var(--purple-soft); }
  .btn {
    font-family: var(--font-body);
    font-weight: 700; font-size: 15px;
    border: none; border-radius: 24px;
    padding: 13px 26px; cursor: pointer;
    background: var(--purple); color: var(--lavender);
    transition: opacity .15s, transform .1s;
  }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn:not(:disabled):active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--purple-soft); outline-offset: 2px; }
  .btn-ghost {
    background: transparent; color: var(--purple-soft);
    font-weight: 500; padding: 13px 10px;
  }
  .screen { display: none; }
  .screen.active { display: block; animation: rise .35s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
    .answer, .btn, .slider-card { transition: none; }
  }

  .slider-wrap { margin: 8px 0 4px; }
  .slider-opts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .slider-opt {
    background: var(--white);
    border: 1.5px solid var(--purple-line);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    font-family: var(--font-body);
    font-size: 12.5px; line-height: 1.4;
    color: var(--purple);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s, color .15s;
  }
  .slider-opt.half {
    border-color: var(--purple-soft);
    background: var(--lavender);
  }
  .slider-caption {
    margin-top: 14px;
    text-align: center;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--purple);
    min-height: 20px;
  }
  .slider-opt:hover { border-color: var(--purple-soft); }
  .slider-opt:focus-visible { outline: 3px solid var(--purple-soft); outline-offset: 2px; }
  .slider-opt.selected {
    background: var(--purple);
    border-color: var(--purple);
    color: var(--lavender);
    font-weight: 700;
  }
  input[type="range"].spectrum {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: var(--purple-line);
    outline: none; cursor: pointer;
  }
  input[type="range"].spectrum::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple);
    border: 3px solid var(--white);
    box-shadow: 0 1px 4px rgba(64,51,147,.35);
    cursor: grab;
  }
  input[type="range"].spectrum::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--purple);
    border: 3px solid var(--white);
    box-shadow: 0 1px 4px rgba(64,51,147,.35);
    cursor: grab;
  }
  input[type="range"].spectrum:focus-visible { outline: 3px solid var(--purple-soft); outline-offset: 4px; }
  .spectrum-labels {
    display: flex; justify-content: space-between;
    margin-top: 10px; font-size: 12px; color: var(--purple-soft);
  }
  .spectrum-labels span { flex: 1; }
  .spectrum-labels span:nth-child(2) { text-align: center; }
  .spectrum-labels span:last-child { text-align: right; }

  .results-kicker {
    font-size: 13px; letter-spacing: 2px; font-weight: 700;
    color: var(--bright); text-transform: uppercase; margin-bottom: 8px;
  }
  .quiz.results-wide { max-width: 960px; }
  .podium {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    align-items: stretch;
    margin: 26px 0 10px;
  }
  .tile {
    perspective: 1200px;
    margin-top: 26px;
  }
  .tile.first { margin-top: 0; grid-column: 2; grid-row: 1; }
  .tile-flip {
    position: relative;
    transform-style: preserve-3d;
    transition: transform .55s ease;
    height: 100%;
  }
  .tile.flipped .tile-flip { transform: rotateY(180deg); }
  .tile-face {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
  }
  .tile-front {
    background: var(--white);
    border: 1.5px solid var(--purple-line);
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 100%;
  }
  .tile.first .tile-front {
    border: 2px solid var(--bright);
    background: #F4EFFE;
  }
  .tile-back {
    position: absolute; inset: 0;
    transform: rotateY(180deg);
    background: #14102E;
    overflow: hidden;
    cursor: pointer;
  }
  .tile-back video {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .back-head {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 14px 26px;
    background: linear-gradient(rgba(20,16,46,.78), rgba(20,16,46,0));
    color: #fff; pointer-events: none;
  }
  .back-title {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 600; line-height: 1.25;
  }
  .back-sub { font-size: 12px; font-weight: 700; opacity: .85; margin-top: 2px; }
  .mute-btn {
    position: absolute; right: 10px; bottom: 44px;
    width: 36px; height: 36px; border-radius: 50%;
    border: none;
    background: rgba(110,110,120,.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .mute-btn svg { width: 17px; height: 17px; display: block; }
  .mute-btn:hover { background: rgba(110,110,120,.65); }
  .back-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }
  .back-close {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 30px; height: 30px; border-radius: 50%;
    border: none;
    background: rgba(110,110,120,.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff; font-size: 13px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .back-close:hover { background: rgba(110,110,120,.8); }
  .back-label {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 12px;
    background: rgba(20,16,46,.72);
    color: #fff; font-size: 12px; font-weight: 700;
    text-align: center;
  }
  .watch-btn {
    background: transparent;
    border: 1.5px solid var(--bright);
    color: var(--bright);
    border-radius: 22px;
    padding: 10px;
    font-family: var(--font-body);
    font-weight: 700; font-size: 13px;
    cursor: pointer;
    margin-top: auto;
  }
  .watch-btn:hover { background: #F4EFFE; }
  .tile-front .tile-btn { margin-top: 0; }
  @media (prefers-reduced-motion: reduce) { .tile-flip { transition: none; } }
  .tile.second { grid-column: 3; grid-row: 1; }
  .tile.third { grid-column: 1; grid-row: 1; }
  .rank-badge {
    font-size: 14px; letter-spacing: 1.5px; font-weight: 700;
    text-transform: uppercase; color: var(--purple-soft);
  }
  .tile.first .rank-badge { color: var(--bright); }
  .tile-club { font-family: var(--font-display); font-size: 19px; font-weight: 600; line-height: 1.25; }
  .tile-somm { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--purple); color: var(--lavender);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 16px; font-weight: 600; flex: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .tile.first .avatar { background: var(--bright); color: #fff; }
  .tile-handle { font-weight: 700; font-size: 13.5px; }
  .tile-somm-label { font-size: 12px; color: var(--purple-soft); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    background: var(--lavender); color: var(--purple);
    border: 1px solid var(--purple-line);
    border-radius: 12px; padding: 3px 9px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
  }
  .tile.first .pill { background: #fff; }
  .pill-ship, .tile.first .pill-ship { background: var(--bright); border-color: var(--bright); color: #fff; }
  .tile-desc {
    font-size: 12px; line-height: 1.55; color: var(--purple);
  }
  .tile-btn {
    margin-top: auto;
    background: var(--bright); color: #fff;
    border-radius: 22px; padding: 12px 10px;
    text-align: center; font-weight: 700; font-size: 13.5px;
    text-decoration: none; display: block;
  }
  .tile-btn:hover { opacity: .9; }
  @media (max-width: 680px) {
    .podium { grid-template-columns: 1fr; }
    .tile, .tile.first, .tile.second, .tile.third { grid-column: auto; grid-row: auto; margin-top: 0; }
  }
</style>

        "<button class='btn' id='next" + qi + "' disabled>Next</button></div>";
    } else {
      inner += "<div class='answers' id='answers" + qi + "' role='" + (q.type === "single" ? "radiogroup" : "group") + "' aria-labelledby='q" + qi + "title'></div>";
      if (q.type === "multi3") {
        inner += "<div class='footer-row'><span class='pick-note' id='pickNote" + qi + "'>0 of 3 selected</span>" +
          "<button class='btn' id='next" + qi + "' disabled>Next</button></div>";
      }
      if (qi > 0) {
        inner += "<div class='footer-row' style='margin-top:" + (q.type === "multi3" ? "4px" : "24px") + "; justify-content:flex-start;'>" +
          "<button class='btn btn-ghost' data-back='" + qi + "'>\u2190 Back</button></div>";
      }
    }
    sec.innerHTML = inner;
    container.appendChild(sec);
  });

  const emailScreen = document.createElement("section");
  emailScreen.className = "screen";
  emailScreen.id = "emailScreen";
  emailScreen.innerHTML =
    "<p class='kicker'>One last thing&hellip;</p>" +
    "<h1>Where should we send your matches?</h1>" +
    "<p class='helper'>Pop in your email to see your results.</p>" +
    "<input type='email' id='emailInput' placeholder='you@example.com' autocomplete='email' style='width:100%; border:1.5px solid var(--purple-line); border-radius:14px; padding:15px 18px; font-family:var(--font-body); font-size:15px; color:var(--purple); background:var(--white);'>" +
    "<p id='emailError' style='color:#B3402E; font-size:13px; margin-top:8px;' hidden>Enter a valid email to see your matches</p>" +
    "<div class='footer-row'><button class='btn btn-ghost' data-back='" + QUESTIONS.length + "'>&larr; Back</button>" +
    "<button class='btn' id='seeResults'>See my results</button></div>";
  container.appendChild(emailScreen);

  const results = document.createElement("section");
  results.className = "screen";
  results.id = "resultsScreen";
  results.innerHTML =
    "<p class='results-kicker'>It's a match</p>" +
    "<h1>Your top three</h1>" +
    "<p class='helper'>Here's the Somms we think you'll want to drink with. Now watch their tasting video to make sure it's a vibe match!</p>" +
    "<div class='podium' id='matchList'></div>" +
    "<div class='footer-row' style='justify-content:center;'><button class='btn btn-ghost' id='restartBtn'>Start over</button></div>";
  container.appendChild(results);

  const screens = [...container.children];

  function goTo(n) {
    current = n;
    screens.forEach((s, i) => s.classList.toggle("active", i === n));
    const dots = document.getElementById("progress").children;
    [...dots].forEach((d, i) => d.classList.toggle("done", i <= n || n >= QUESTIONS.length));
    document.querySelector(".quiz").classList.toggle("results-wide", n === QUESTIONS.length + 1);
    document.getElementById("stepCount").textContent =
      n < QUESTIONS.length ? (n + 1) + " of " + QUESTIONS.length :
      (n === QUESTIONS.length ? "Almost there" : "Results");
    window.scrollTo({ top: 0 });
  }

  function advance(qi) {
    if (qi + 1 < QUESTIONS.length) goTo(qi + 1);
    else goTo(QUESTIONS.length);
  }

  QUESTIONS.forEach((q, qi) => {
    if (q.type === "slider") {
      const slider = document.getElementById("slider" + qi);
      const opts = [...document.getElementById("sliderOpts" + qi).children];
      const cap = document.getElementById("sliderCap" + qi);
      const next = document.getElementById("next" + qi);
      const update = () => {
        const v = +slider.value;
        state[qi] = v;
        opts.forEach(el => {
          const oi = +el.dataset.opt;
          el.classList.toggle("selected", oi === v);
          el.classList.toggle("half", Math.abs(v - oi) === 1);
          el.setAttribute("aria-checked", oi === v ? "true" : "false");
        });
        cap.textContent = q.answers[v].text;
        next.disabled = false;
      };
      slider.addEventListener("input", update);
      slider.addEventListener("click", update);
      opts.forEach(el => {
        el.onclick = () => { slider.value = el.dataset.opt; update(); };
      });
      next.onclick = () => advance(qi);
    } else {
      const wrap = document.getElementById("answers" + qi);
      q.answers.forEach((a, ai) => {
        const b = document.createElement("button");
        b.className = "answer";
        if (q.type === "single") { b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false"); }
        else b.setAttribute("aria-pressed", "false");
        b.innerHTML = "<span>" + a.text + "</span>" +
          (a.price ? "<span class='price'>" + a.price + "</span>" : "") +
          "<span class='tick'>\u2713</span>";
        b.onclick = () => {
          if (q.type === "single") {
            state[qi] = ai;
            [...wrap.children].forEach((el, j) => {
              el.classList.toggle("selected", j === ai);
              el.setAttribute("aria-checked", j === ai ? "true" : "false");
            });
            setTimeout(() => advance(qi), 350);
          } else {
            const set = state[qi];
            if (set.has(ai)) set.delete(ai);
            else if (set.size < 3) set.add(ai);
            [...wrap.children].forEach((el, j) => {
              const on = set.has(j);
              el.classList.toggle("selected", on);
              el.setAttribute("aria-pressed", on ? "true" : "false");
            });
            document.getElementById("pickNote" + qi).textContent = set.size + " of 3 selected";
            document.getElementById("next" + qi).disabled = set.size !== 3;
          }
        };
        wrap.appendChild(b);
      });
      if (q.type === "multi3") document.getElementById("next" + qi).onclick = () => advance(qi);
    }
  });

  document.querySelectorAll("[data-back]").forEach(b => {
    b.onclick = () => goTo(+b.dataset.back - 1);
  });

  function showResults() {
    const scores = Object.fromEntries(ALL.map(k => [k, 0]));
    const add = pts => Object.entries(pts).forEach(([k, v]) => scores[k] += v);
    QUESTIONS.forEach((q, qi) => {
      const s = state[qi];
      if (q.type === "multi3") s.forEach(ai => add(q.answers[ai].points));
      else if (s !== null) add(q.answers[s].points);
    });

    const ranked = ALL.map(k => ({ key: k, score: scores[k] }))
      .sort((a, b) => b.score - a.score);
    let order = ranked.slice();
    if (state[4] === 0) {
      const forcedKey = (state[3] === 0 || state[3] === 1) ? "hillary" : "tps";
      order = [order.find(r => r.key === forcedKey)].concat(order.filter(r => r.key !== forcedKey));
    }
    if (state[4] === 2 || state[4] === 3) {
      order = order.filter(r => r.key !== "tps").concat(order.filter(r => r.key === "tps"));
    }
    const sssIdx = order.findIndex(r => r.key === "sss");
    let top3, bumped = null;
    if (sssIdx <= 2) {
      top3 = order.slice(0, 3);
    } else {
      bumped = order[2];
      top3 = [order[0], order[1], order[sssIdx]];
    }

    const rankLabel = ["Your Top Match", "No. 2", "No. 3"];
    const rankCls = ["first", "second", "third"];
    document.getElementById("matchList").innerHTML = top3.map((r, i) => {
      const c = CLUBS[r.key];
      return "<div class='tile " + rankCls[i] + "'><div class='tile-flip'>" +
        "<div class='tile-face tile-front'>" +
        "<div class='rank-badge'>" + rankLabel[i] + "</div>" +
        "<h3 class='tile-club'>" + c.club + "</h3>" +
        "<div class='tile-somm'><div class='avatar'>" + (c.photo ? "<img src='" + c.photo + "' alt='" + c.somm + "'>" : c.initials) + "</div>" +
        "<div><div class='tile-handle'>" + c.handle + "</div><div class='tile-somm-label'>Somm</div></div></div>" +
        "<div class='pills'>" +
        "<span class='pill'>" + c.price + "</span>" +
        "<span class='pill'>" + c.cadence + "</span>" +
        "<span class='pill'>" + c.bottles + "</span></div>" +
        "<p class='tile-desc'>" + c.desc + "</p>" +
        (c.clip || c.vimeo ? "<button class='watch-btn'>&#9654;&nbsp; Watch a tasting</button>" : "") +
        "<a class='tile-btn' data-club='" + r.key + "' href='" + CLUB_PAGE_URL.replace("{slug}", c.slug) + "' target='_blank' rel='noopener'>Select This Club</a>" +
        "</div>" +
        (c.clip || c.vimeo ? "<div class='tile-face tile-back'>" +
          (USE_VIMEO && c.vimeo
            ? "<iframe class='back-frame' data-vsrc='https://player.vimeo.com/video/" + c.vimeo + "?h=" + c.vhash + "&autoplay=1&loop=1&title=0&byline=0&portrait=0' allow='autoplay; fullscreen' frameborder='0'></iframe>"
            : "<video loop playsinline preload='none' poster='" + c.poster + "' src='" + c.clip + "' data-key='" + r.key + "'></video>" +
              "<button class='mute-btn' aria-label='Mute or unmute'>" + ICON_SOUND + "</button>" +
              "<div class='back-label'>" + c.handle + " &middot; tap to flip back</div>") +
          "<div class='back-head'><div class='back-title'>" + c.club + "</div><div class='back-sub'>" + c.boxLabel + "</div></div>" +
          "<button class='back-close' aria-label='Flip back'>&#10005;</button>" +
          "</div>" : "") +
        "</div></div>";
    }).join("");



    const unflip = tile => {
      tile.classList.remove("flipped");
      const v = tile.querySelector("video");
      if (v) v.pause();
      const f = tile.querySelector(".back-frame");
      if (f) f.removeAttribute("src");
    };
    document.querySelectorAll(".watch-btn").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".tile.flipped").forEach(unflip);
        const tile = b.closest(".tile");
        tile.classList.add("flipped");
        const f = tile.querySelector(".back-frame");
        if (f && !f.getAttribute("src")) f.setAttribute("src", f.dataset.vsrc);
        const v = tile.querySelector("video");
        if (v) v.play();
      };
    });
    document.querySelectorAll(".back-close").forEach(x => {
      x.onclick = e => { e.stopPropagation(); unflip(x.closest(".tile")); };
    });
    document.querySelectorAll(".tile-back").forEach(bk => {
      bk.onclick = () => unflip(bk.closest(".tile"));
    });
    document.querySelectorAll(".tile-btn").forEach(a => {
      a.addEventListener("click", () => {
        try {
          const fd = new URLSearchParams();
          fd.append(GFORM.fields.email, quizEmail || "");
          fd.append(GFORM.fields.answers_json, JSON.stringify({ event: "select_click", club: a.dataset.club }));
          fetch(GFORM.action, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: fd.toString() });
        } catch (e) {}
      });
    });
    document.querySelectorAll(".mute-btn").forEach(m => {
      m.onclick = e => {
        e.stopPropagation();
        const v = m.closest(".tile-back").querySelector("video");
        v.muted = !v.muted;
        m.innerHTML = v.muted ? ICON_MUTED : ICON_SOUND;
      };
    });

    const record = {
      submitted_at: new Date().toISOString(),
      email: quizEmail,
      answers: { dtr: state[0], top3_picks: [...state[1]], slider: state[2], natty: state[3], budget: state[4] },
      scores: scores,
      matches: top3.map(r => r.key)
    };
    try {
      const log = JSON.parse(localStorage.getItem("fyc_submissions") || "[]");
      log.push(record);
      localStorage.setItem("fyc_submissions", JSON.stringify(log));
    } catch (e) {}
    try {
      const fd = new URLSearchParams();
      fd.append(GFORM.fields.email, record.email);
      fd.append(GFORM.fields.answers_json, JSON.stringify(record.answers));
      fd.append(GFORM.fields.scores_json, JSON.stringify(record.scores));
      fd.append(GFORM.fields.matches_json, JSON.stringify(record.matches));
      fetch(GFORM.action, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: fd.toString() });
    } catch (e) {}
    if (RESULTS_ENDPOINT) {
      try {
        fetch(RESULTS_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: record.email,
            submitted_at: record.submitted_at,
            answers_json: JSON.stringify(record.answers),
            scores_json: JSON.stringify(record.scores),
            matches_json: JSON.stringify(record.matches)
          }) });
      } catch (e) {}
    }

    goTo(QUESTIONS.length + 1);
  }

  document.getElementById("seeResults").onclick = () => {
    const inp = document.getElementById("emailInput");
    const err = document.getElementById("emailError");
    const email = inp.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.hidden = false; inp.focus(); return; }
    err.hidden = true;
    quizEmail = email;
    showResults();
  };
  document.getElementById("emailInput").addEventListener("input", () => {
    document.getElementById("emailError").hidden = true;
  });

  document.getElementById("restartBtn").onclick = () => {
    QUESTIONS.forEach((q, qi) => {
      if (q.type === "multi3") {
        state[qi].clear();
        document.getElementById("pickNote" + qi).textContent = "0 of 3 selected";
        document.getElementById("next" + qi).disabled = true;
        [...document.getElementById("answers" + qi).children].forEach(el => {
          el.classList.remove("selected"); el.setAttribute("aria-pressed", "false");
        });
      } else if (q.type === "slider") {
        state[qi] = null;
        document.getElementById("slider" + qi).value = Math.floor((q.answers.length - 1) / 2);
        [...document.getElementById("sliderOpts" + qi).children].forEach(el => {
          el.classList.remove("selected", "half"); el.setAttribute("aria-checked", "false");
        });
        document.getElementById("sliderCap" + qi).innerHTML = "&nbsp;";
        document.getElementById("next" + qi).disabled = true;
      } else {
        state[qi] = null;
        [...document.getElementById("answers" + qi).children].forEach(el => {
          el.classList.remove("selected"); el.setAttribute("aria-checked", "false");
        });
      }
    });
    quizEmail = null;
    document.getElementById("emailInput").value = "";
    document.getElementById("emailError").hidden = true;
    goTo(0);
  };

  goTo(0);
</script>
